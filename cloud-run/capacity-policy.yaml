schemaVersion: 1
services:
  studiohub-pdf:
    region: us-east4
    minInstances: 0
    maxInstances: 4
    # 1Gi at concurrency 4 ran out of memory on production (2026-10-03): a
    # proposal with a full-size logo and four renders at once is more than a
    # gigabyte. Twice the memory, half the renders per instance.
    concurrency: 2
    cpu: 1
    memory: 2Gi
    timeoutSeconds: 600
    monthlyWarningUsd: 75
    monthlyCriticalUsd: 150
  studiohub-file-safety:
    region: us-east1
    minInstances: 0
    maxInstances: 4
    concurrency: 2
    cpu: 1
    memory: 2Gi
    timeoutSeconds: 600
    monthlyWarningUsd: 100
    monthlyCriticalUsd: 200
  studiohub-ai:
    region: us-east4
    minInstances: 0
    maxInstances: 6
    concurrency: 8
    cpu: 1
    memory: 1Gi
    timeoutSeconds: 600
    monthlyWarningUsd: 150
    monthlyCriticalUsd: 300
