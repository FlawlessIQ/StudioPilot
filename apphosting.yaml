runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Address autocomplete for venue, COI and service-area fields.
  #
  # Server-only: RUNTIME availability, never BUILD, and never prefixed
  # NEXT_PUBLIC_. Both lookup routes proxy it so the key stays out of the
  # browser, where a referrer-restricted key would still be a spendable
  # secret sitting in page source.
  #
  # The key is restricted to "Places API (New)" — places.googleapis.com,
  # not places-backend.googleapis.com, which is the legacy Places API and
  # 403s the v1 endpoints this provider calls.
  #
  # If the secret is ever deleted, comment this block out before pushing:
  # App Hosting fails the whole rollout on a missing secret reference, so
  # a broken deploy is the failure mode rather than a disabled feature.
  - variable: GOOGLE_PLACES_API_KEY
    secret: googlePlacesApiKey
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_URL
    value: https://studio-cue.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://studio-cue.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_VERSION
    value: firebase-production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_INTEGRATION_MODE
    value: live
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_AUTH_MODE
    value: live
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_DATA_MODE
    value: live
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PROVIDER_MODE
    value: live
    availability:
      - BUILD
      - RUNTIME
  - variable: PROVIDER_MOCK_MODE
    value: "false"
    availability:
