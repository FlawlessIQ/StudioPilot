# Every push to main, checked the way CLAUDE.md asks a person to check before
# pushing — because work lands on main with no pull request, and until now
# nothing ran unless someone remembered to run it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Some date tests describe a reader in Eastern time (late evening that is
    # already tomorrow in UTC); they assume the machine is there too.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      # The unit tests import functions/src, which resolves its own packages.
      - run: npm ci
        working-directory: functions
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  functions:
    name: Functions build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions

  rules:
    name: Firestore and Storage rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # The emulators need no login; studiohub-dev only names the project.
      - run: npm run test:rules
      - run: npm run test:storage-rules

  layout:
    # Every page, at a laptop, a desk and a phone: nothing squeezed to a word
    # per line, drawn on top of something else, or wider than the window
    # (e2e/layout-integrity.spec.ts). Today's inquiries card shipped broken on
    # every desk-sized window because nothing looked (2026-10-09). Mock mode:
    # no Firebase, the demo records stand in for real jobs.
    name: Layout integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test e2e/layout-integrity.spec.ts --project=desktop-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-report
          path: test-results
          retention-days: 7
